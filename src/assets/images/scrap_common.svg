<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients for Scrap Parts -->
    <linearGradient id="metalPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="40%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="metalGearGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="metalGearGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="bronzeScrewGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="steelPipeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <filter id="scrapShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#1e293b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Pure White Background -->
  <rect width="512" height="512" fill="#ffffff" />

  <!-- Ground Soft Shadow -->
  <ellipse cx="256" cy="415" rx="160" ry="26" fill="#334155" opacity="0.16" filter="blur(10px)" />

  <g filter="url(#scrapShadow)">
    <!-- 1. Background Bent Curved Iron Rod / Pipe -->
    <path d="M120,350 C140,240 220,180 340,160 C380,155 405,175 395,200 C380,230 330,225 280,240 C210,260 170,330 150,380 Z" fill="url(#steelPipeGrad)" stroke="#64748b" stroke-width="2" />

    <!-- 2. Large Background Cogwheel / Gear -->
    <g transform="translate(300, 240)">
      <circle cx="0" cy="0" r="90" fill="url(#metalGearGrad1)" stroke="#cbd5e1" stroke-width="2" />
      <!-- Teeth -->
      <path d="
        M -20,-102 L 20,-102 L 15,-85 L -15,-85 Z
        M 85,-15 L 102,-20 L 102,20 L 85,15 Z
        M 15,85 L 20,102 L -20,102 L -15,85 Z
        M -85,15 L -102,20 L -102,-20 L -85,-15 Z
        M 50,-70 L 68,-78 L 78,-48 L 60,-40 Z
        M 60,40 L 78,48 L 68,78 L 50,70 Z
        M -50,70 L -68,78 L -78,48 L -60,40 Z
        M -60,-40 L -78,-48 L -68,-78 L -50,-70 Z
      " fill="url(#metalGearGrad1)" />
      <!-- Inner Hollow -->
      <circle cx="0" cy="0" r="45" fill="#ffffff" />
      <circle cx="0" cy="0" r="35" fill="url(#metalGearGrad2)" stroke="#94a3b8" stroke-width="2" />
      <circle cx="0" cy="0" r="14" fill="#ffffff" />
    </g>

    <!-- 3. Base Metal Plate with Rivets (Tấm kim loại phế liệu gãy góc) -->
    <polygon points="110,320 280,290 320,390 140,410" fill="url(#metalPlateGrad)" stroke="#cbd5e1" stroke-width="2" />
    <!-- Rivet holes on plate -->
    <circle cx="135" cy="335" r="5" fill="#1e293b" />
    <circle cx="135" cy="335" r="3" fill="#cbd5e1" />
    <circle cx="260" cy="310" r="5" fill="#1e293b" />
    <circle cx="260" cy="310" r="3" fill="#cbd5e1" />
    <circle cx="160" cy="390" r="5" fill="#1e293b" />
    <circle cx="160" cy="390" r="3" fill="#cbd5e1" />
    <!-- Scratch on plate -->
    <line x1="170" y1="330" x2="230" y2="370" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <line x1="172" y1="332" x2="232" y2="372" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

    <!-- 4. Front Medium Gear (Bánh răng phía trước) -->
    <g transform="translate(185, 275) rotate(22)">
      <circle cx="0" cy="0" r="65" fill="url(#metalGearGrad2)" stroke="#e2e8f0" stroke-width="2" />
      <!-- Teeth -->
      <path d="
        M -15,-76 L 15,-76 L 12,-62 L -12,-62 Z
        M 62,-12 L 76,-15 L 76,15 L 62,12 Z
        M 12,62 L 15,76 L -15,76 L -12,62 Z
        M -62,12 L -76,15 L -76,-15 L -62,-12 Z
        M 40,-50 L 54,-56 L 56,-32 L 42,-28 Z
        M 42,28 L 56,32 L 54,56 L 40,50 Z
        M -40,50 L -54,56 L -56,32 L -42,28 Z
        M -42,-28 L -56,-32 L -54,-56 L -40,-50 Z
      " fill="url(#metalGearGrad2)" />
      <!-- Inner Hub -->
      <circle cx="0" cy="0" r="28" fill="#ffffff" />
      <circle cx="0" cy="0" r="20" fill="url(#metalGearGrad1)" stroke="#cbd5e1" stroke-width="1.5" />
      <circle cx="0" cy="0" r="8" fill="#1e293b" />
    </g>

    <!-- 5. Scattered Nuts, Screws & Bolts (Bu-lông, đai ốc) -->
    <!-- Hex Nut Left -->
    <g transform="translate(125, 385)">
      <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="url(#metalGearGrad1)" stroke="#e2e8f0" stroke-width="1.5" />
      <circle cx="0" cy="0" r="8" fill="#1e293b" />
      <circle cx="0" cy="0" r="6" fill="#475569" />
    </g>

    <!-- Bronze/Brass Bolt Right -->
    <g transform="translate(325, 360) rotate(-35)">
      <!-- Bolt Thread -->
      <rect x="-8" y="-20" width="16" height="40" rx="3" fill="url(#bronzeScrewGrad)" stroke="#f59e0b" stroke-width="1" />
      <line x1="-8" y1="-12" x2="8" y2="-10" stroke="#fef3c7" stroke-width="1.5" />
      <line x1="-8" y1="-4" x2="8" y2="-2" stroke="#fef3c7" stroke-width="1.5" />
      <line x1="-8" y1="4" x2="8" y2="6" stroke="#fef3c7" stroke-width="1.5" />
      <line x1="-8" y1="12" x2="8" y2="14" stroke="#fef3c7" stroke-width="1.5" />
      <!-- Bolt Hex Head -->
      <polygon points="-16,-20 0,-28 16,-20 16,-12 0,-4 -16,-12" fill="#d97706" stroke="#fef3c7" stroke-width="1.5" />
    </g>

    <!-- Hex Nut Right Bottom -->
    <g transform="translate(355, 395)">
      <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" fill="url(#metalGearGrad2)" stroke="#94a3b8" stroke-width="1.5" />
      <circle cx="0" cy="0" r="6" fill="#1e293b" />
    </g>

    <!-- Metallic Wire / Coil Spring (Lò xo phế liệu) -->
    <path d="M 230,340 Q 250,320 270,340 T 310,340 T 350,340" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
