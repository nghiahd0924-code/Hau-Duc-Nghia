<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Iron Ingot Top Face Gradient -->
    <linearGradient id="ironTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Iron Ingot Front Face Gradient -->
    <linearGradient id="ironFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Iron Ingot Side Face Gradient -->
    <linearGradient id="ironSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="ironLightBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <filter id="ironShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Pure White Background -->
  <rect width="512" height="512" fill="#ffffff" />

  <!-- Cast Shadow on ground -->
  <ellipse cx="256" cy="425" rx="170" ry="28" fill="#1e293b" opacity="0.2" filter="blur(10px)" />

  <g filter="url(#ironShadow)">
    <!-- BOTTOM LEFT IRON INGOT -->
    <g transform="translate(0, 40)">
      <!-- Front Face -->
      <polygon points="80,310 240,310 225,360 95,360" fill="url(#ironFront)" stroke="#334155" stroke-width="1.5" />
      <!-- Side Face Right -->
      <polygon points="240,310 330,260 315,310 225,360" fill="url(#ironSide)" stroke="#1e293b" stroke-width="1.5" />
      <!-- Top Face -->
      <polygon points="95,260 255,260 330,260 240,310 80,310 80,310" fill="url(#ironTop)" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Top Bevel Highlight -->
      <line x1="80" y1="310" x2="240" y2="310" stroke="url(#ironLightBevel)" stroke-width="2.5" />
      <line x1="240" y1="310" x2="330" y2="260" stroke="url(#ironLightBevel)" stroke-width="2" />
    </g>

    <!-- BOTTOM RIGHT IRON INGOT -->
    <g transform="translate(130, 20)">
      <!-- Front Face -->
      <polygon points="120,310 280,310 265,360 135,360" fill="url(#ironFront)" stroke="#334155" stroke-width="1.5" />
      <!-- Side Face Right -->
      <polygon points="280,310 370,260 355,310 265,360" fill="url(#ironSide)" stroke="#1e293b" stroke-width="1.5" />
      <!-- Top Face -->
      <polygon points="135,260 295,260 370,260 280,310 120,310" fill="url(#ironTop)" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Top Bevel Highlight -->
      <line x1="120" y1="310" x2="280" y2="310" stroke="url(#ironLightBevel)" stroke-width="2.5" />
      <line x1="280" y1="310" x2="370" y2="260" stroke="url(#ironLightBevel)" stroke-width="2" />
    </g>

    <!-- TOP PYRAMID CENTER IRON INGOT -->
    <g transform="translate(70, -45)">
      <!-- Front Face -->
      <polygon points="100,280 270,280 255,335 115,335" fill="url(#ironFront)" stroke="#334155" stroke-width="1.5" />
      <!-- Side Face Right -->
      <polygon points="270,280 365,225 350,280 255,335" fill="url(#ironSide)" stroke="#1e293b" stroke-width="1.5" />
      <!-- Top Face -->
      <polygon points="115,225 285,225 365,225 270,280 100,280" fill="url(#ironTop)" stroke="#cbd5e1" stroke-width="1.5" />

      <!-- High Specular Highlight on Top Ridge -->
      <line x1="100" y1="280" x2="270" y2="280" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <line x1="270" y1="280" x2="365" y2="225" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />

      <!-- Industrial Iron Stamp Engraving on Top: "FE 99.9%" with hammer icon -->
      <g transform="translate(200, 252) skewX(-32) scale(0.9, 0.7)">
        <rect x="-35" y="-14" width="70" height="28" rx="4" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,2" />
        <text x="0" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#334155" text-anchor="middle" letter-spacing="1">IRON</text>
      </g>
    </g>
  </g>

  <!-- Steel Sparkle Reflection -->
  <g transform="translate(340, 230) scale(0.6)">
    <path d="M0,-16 Q0,0 16,0 Q0,0 0,16 Q0,0 -16,0 Q0,0 0,-16 Z" fill="#ffffff" />
  </g>
</svg>
