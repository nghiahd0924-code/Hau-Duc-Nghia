<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </radialGradient>

    <!-- Diamond Primary Gradient -->
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <linearGradient id="facetLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <linearGradient id="facetDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="facetMid" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow for Realistic Depth -->
    <filter id="diamondShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Pure White Background to Match other cutout assets -->
  <rect width="512" height="512" fill="#ffffff" />

  <!-- Diamond Shadow on ground -->
  <ellipse cx="256" cy="425" rx="140" ry="24" fill="#0369a1" opacity="0.12" filter="blur(8px)" />

  <!-- MAIN BRILLIANT CUT DIAMOND BODY -->
  <g filter="url(#diamondShadow)">
    <!-- Pavilion / Bottom V-facets -->
    <!-- Bottom Tip: (256, 400) -->
    <!-- Girdle points: (90, 205), (150, 205), (256, 215), (362, 205), (422, 205) -->

    <!-- Outer Left Pavilion -->
    <polygon points="90,205 160,210 256,400" fill="#0284c7" />
    <!-- Inner Left Pavilion -->
    <polygon points="160,210 256,215 256,400" fill="#38bdf8" />
    <!-- Inner Right Pavilion -->
    <polygon points="256,215 352,210 256,400" fill="#0284c7" />
    <!-- Outer Right Pavilion -->
    <polygon points="352,210 422,205 256,400" fill="#0369a1" />

    <!-- Crown / Upper Facets -->
    <!-- Upper Table: points (170, 115), (342, 115), (390, 150), (342, 185), (170, 185), (122, 150) -->
    <!-- Table Face (Flat Top) -->
    <polygon points="175,115 337,115 372,150 337,185 175,185 140,150" fill="url(#facetLight)" stroke="#ffffff" stroke-width="1.5" />

    <!-- Upper Kite Facets -->
    <polygon points="256,115 175,115 200,150" fill="#f0f9ff" opacity="0.9" />
    <polygon points="256,115 337,115 312,150" fill="#ffffff" opacity="0.95" />

    <!-- Corner Star Facets -->
    <polygon points="175,115 90,205 160,210 175,185" fill="url(#facetMid)" />
    <polygon points="175,185 160,210 256,215" fill="url(#facetLight)" />
    <polygon points="256,215 256,185 337,185" fill="#bae6fd" />
    <polygon points="256,185 256,215 175,185" fill="#e0f2fe" />
    <polygon points="337,185 256,215 352,210" fill="url(#facetTop)" />
    <polygon points="337,115 422,205 352,210 337,185" fill="url(#facetDeep)" />

    <!-- Left Flank Star -->
    <polygon points="175,115 140,150 90,205" fill="#7dd3fc" />
    <!-- Right Flank Star -->
    <polygon points="337,115 372,150 422,205" fill="#0ea5e9" />

    <!-- Girdle Edge Line (Highlights) -->
    <polyline points="90,205 160,210 256,215 352,210 422,205" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Girdle Back Rim -->
    <polygon points="90,205 175,115 337,115 422,205" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- INTERNAL BRILLIANCE & PRISM REFLECTIONS -->
  <!-- White Specular Highlights -->
  <polygon points="185,125 327,125 300,145 212,145" fill="#ffffff" opacity="0.85" />
  <polygon points="165,190 200,208 245,212 210,190" fill="#ffffff" opacity="0.6" />

  <!-- Central Star Reflection -->
  <circle cx="256" cy="150" r="16" fill="#ffffff" opacity="0.9" filter="blur(2px)" />

  <!-- SPARKLES / LENS FLARES -->
  <!-- Top Right Big Sparkle -->
  <g transform="translate(372, 140)">
    <path d="M0,-24 Q0,0 24,0 Q0,0 0,24 Q0,0 -24,0 Q0,0 0,-24 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
  </g>

  <!-- Left Bottom Sparkle -->
  <g transform="translate(140, 230) scale(0.65)">
    <path d="M0,-20 Q0,0 20,0 Q0,0 0,20 Q0,0 -20,0 Q0,0 0,-20 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="3" fill="#7dd3fc" />
  </g>

  <!-- Bottom Tip Sparkle -->
  <g transform="translate(256, 395) scale(0.55)">
    <path d="M0,-18 Q0,0 18,0 Q0,0 0,18 Q0,0 -18,0 Q0,0 0,-18 Z" fill="#ffffff" />
  </g>

  <!-- Top Left Soft Sparkle -->
  <g transform="translate(170, 110) scale(0.5)">
    <path d="M0,-16 Q0,0 16,0 Q0,0 0,16 Q0,0 -16,0 Q0,0 0,-16 Z" fill="#ffffff" />
  </g>
</svg>
