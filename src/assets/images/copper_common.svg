<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Copper Ingot Top Face Gradient -->
    <linearGradient id="copperTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="35%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Copper Ingot Front Face Gradient -->
    <linearGradient id="copperFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>

    <!-- Copper Ingot Side Face Gradient -->
    <linearGradient id="copperSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>

    <linearGradient id="copperLightBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.2" />
    </linearGradient>

    <filter id="copperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#431407" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Pure White Background -->
  <rect width="512" height="512" fill="#ffffff" />

  <!-- Cast Shadow on ground -->
  <ellipse cx="256" cy="425" rx="170" ry="28" fill="#7c2d12" opacity="0.18" filter="blur(10px)" />

  <g filter="url(#copperShadow)">
    <!-- BOTTOM LEFT COPPER INGOT -->
    <g transform="translate(0, 40)">
      <!-- Front Face -->
      <polygon points="80,310 240,310 225,360 95,360" fill="url(#copperFront)" stroke="#9a3412" stroke-width="1.5" />
      <!-- Side Face Right -->
      <polygon points="240,310 330,260 315,310 225,360" fill="url(#copperSide)" stroke="#431407" stroke-width="1.5" />
      <!-- Top Face -->
      <polygon points="95,260 255,260 330,260 240,310 80,310" fill="url(#copperTop)" stroke="#fdba74" stroke-width="1.5" />
      <!-- Top Bevel Highlight -->
      <line x1="80" y1="310" x2="240" y2="310" stroke="url(#copperLightBevel)" stroke-width="2.5" />
      <line x1="240" y1="310" x2="330" y2="260" stroke="url(#copperLightBevel)" stroke-width="2" />
    </g>

    <!-- BOTTOM RIGHT COPPER INGOT -->
    <g transform="translate(130, 20)">
      <!-- Front Face -->
      <polygon points="120,310 280,310 265,360 135,360" fill="url(#copperFront)" stroke="#9a3412" stroke-width="1.5" />
      <!-- Side Face Right -->
      <polygon points="280,310 370,260 355,310 265,360" fill="url(#copperSide)" stroke="#431407" stroke-width="1.5" />
      <!-- Top Face -->
      <polygon points="135,260 295,260 370,260 280,310 120,310" fill="url(#copperTop)" stroke="#fdba74" stroke-width="1.5" />
      <!-- Top Bevel Highlight -->
      <line x1="120" y1="310" x2="280" y2="310" stroke="url(#copperLightBevel)" stroke-width="2.5" />
      <line x1="280" y1="310" x2="370" y2="260" stroke="url(#copperLightBevel)" stroke-width="2" />
    </g>

    <!-- TOP PYRAMID CENTER COPPER INGOT -->
    <g transform="translate(70, -45)">
      <!-- Front Face -->
      <polygon points="100,280 270,280 255,335 115,335" fill="url(#copperFront)" stroke="#9a3412" stroke-width="1.5" />
      <!-- Side Face Right -->
      <polygon points="270,280 365,225 350,280 255,335" fill="url(#copperSide)" stroke="#431407" stroke-width="1.5" />
      <!-- Top Face -->
      <polygon points="115,225 285,225 365,225 270,280 100,280" fill="url(#copperTop)" stroke="#fed7aa" stroke-width="1.5" />

      <!-- High Specular Highlight on Top Ridge -->
      <line x1="100" y1="280" x2="270" y2="280" stroke="#fff7ed" stroke-width="3" stroke-linecap="round" />
      <line x1="270" y1="280" x2="365" y2="225" stroke="#fed7aa" stroke-width="2.5" stroke-linecap="round" />

      <!-- Copper Hallmark Stamp on Top: "COPPER" -->
      <g transform="translate(200, 252) skewX(-32) scale(0.9, 0.7)">
        <rect x="-42" y="-14" width="84" height="28" rx="4" fill="none" stroke="#7c2d12" stroke-width="1.5" stroke-dasharray="3,2" />
        <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#7c2d12" text-anchor="middle" letter-spacing="1">COPPER</text>
      </g>
    </g>
  </g>

  <!-- Copper Warm Sparkle -->
  <g transform="translate(180, 235) scale(0.6)">
    <path d="M0,-16 Q0,0 16,0 Q0,0 0,16 Q0,0 -16,0 Q0,0 0,-16 Z" fill="#ffedd5" />
  </g>
</svg>
